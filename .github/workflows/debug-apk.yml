name: Debug APK (safe HOME test)

on:
  push:
    branches: [main, prism-home-fix, 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      # Keep the test key across runs so subsequent test APKs can update in place.
      # This is a debug key, not a release credential; cache eviction can still change it.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: glass-home-test-debug-key-v1
      - name: Unit tests and debug APK
        working-directory: launcher
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Lint report (existing incomplete translations are informational)
        continue-on-error: true
        working-directory: launcher
        run: bash ./gradlew --no-daemon lintDebug
      - name: Prepare download
        run: |
          mkdir -p apk
          cp launcher/app/build/outputs/apk/debug/app-debug.apk apk/Glass-TV-Enhanced-HOME-test.apk
          cp docs/PRISM-HOME-TEST.md apk/INSTALL-AND-TEST.md
          cd apk
          sha256sum Glass-TV-Enhanced-HOME-test.apk > SHA256SUMS.txt
      - name: Download this artifact in Safari
        uses: actions/upload-artifact@v4
        with:
          name: Glass-TV-Enhanced-HOME-test-${{ github.run_number }}
          path: apk/
          if-no-files-found: error
          retention-days: 30
      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-test-reports-${{ github.run_number }}
          path: |
            launcher/app/build/reports/tests/
            launcher/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
